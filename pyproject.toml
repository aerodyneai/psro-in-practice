[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psrolab"
version = "0.1.0"
description = "Companion code for 'Policy-Space Response Oracles in Practice' — every figure in the book is generated by a script in this repo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amardeep Mond" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",        # LP-based Nash solver (linprog)
    "matplotlib>=3.8",    # all book figures
]

[project.optional-dependencies]
rl = [
    "torch>=2.2",         # neural best-response oracles (Part II+)
    "open_spiel>=1.4",    # Kuhn/Leduc poker, reference implementations
]
distributed = [
    "ray>=2.9",           # Pipeline PSRO, parallel BR training (Part III)
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
